<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CODEX_02 — kiểm chứng sprite v0.4</title><link rel="stylesheet" href="app.css"><link rel="stylesheet" href="fantasy.css">
<style>body{height:100vh;overflow:auto;padding:18px;background:#17221b}h1{font-size:20px;color:#e3c896}
.review-layout{display:grid;grid-template-columns:minmax(0,1fr) 240px;gap:16px;height:76vh}
#review-canvas{width:100%;height:100%;border:2px solid #716e50;background:#121b16}#review-mini{display:none}
.review-panel{overflow:auto}.review-panel button{display:block;width:100%;text-align:left;margin:6px 0;padding:8px}
#review-info{font-size:12px;line-height:1.8;color:#d6cfaf}p{color:#a9b79d;font-size:12px}
@media(max-width:700px){.review-layout{grid-template-columns:1fr;height:auto}#review-canvas{height:650px}}
</style></head><body>
<h1>Kiểm chứng v0.4 · Cận cảnh 3 / tile 32 px</h1>
<p>Fixture dùng Game, item và Painter thật. Dữ liệu riêng cho kiểm chứng, không ghi vào save người chơi.</p>
<div class="review-layout"><canvas id="review-canvas" aria-label="Cận cảnh bốn hero mới, bốn quái mới và ba vũ khí"></canvas>
<aside class="review-panel"><div id="review-units"></div><button id="review-hit">Xem khung trúng đòn</button>
<button id="review-move">Đổi idle / run</button><div id="review-info"></div></aside></div>
<canvas id="review-mini"></canvas><script type="module" src="showcase.js"></script></body></html>
