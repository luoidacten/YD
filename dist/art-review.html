<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>YD · Kiểm chứng art và gameplay</title><link rel="stylesheet" href="app.css"><link rel="stylesheet" href="fantasy.css">
<style>body{width:1280px;min-width:1280px;height:720px;padding:16px;overflow:auto;background:#17221b;color:#dfd5b7}h1{font-size:20px;margin:4px 0}
.review-tools{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.review-tools button{padding:8px;font-size:14px}
.review-grid{display:grid;grid-template-columns:minmax(0,1fr) 256px;gap:16px;height:500px;min-height:500px}
#art-canvas{width:100%;height:100%;border:2px solid #777258;background:#111a17}.review-aside{overflow:auto}
#art-info{font-size:14px;line-height:1.7}#art-info button{padding:8px}.review-aside>button{padding:8px;width:100%;margin:8px 0}
#perf-data{font-size:14px;white-space:pre-wrap}p{font-size:14px}#art-mini{display:none}
@media(max-width:800px){.review-grid{grid-template-columns:1fr;height:auto}#art-canvas{height:500px}}</style></head><body>
<h1>Kiểm chứng CODEX_04–05 · Game/Painter thật · pixel nguyên</h1>
<p>Fixture QA riêng, không đọc hoặc ghi save người chơi. Hiệu ứng thị giác giữ đúng thời điểm damage hiện có.</p>
<div class="review-tools"><button data-scene="heroes04">04 · Hero</button><button data-scene="monsters04">04 · Quái</button>
<button data-scene="fx04">04 · Phép</button><button data-scene="heroes05">05 · Class đang đánh</button>
<button data-scene="monsters05">05 · Chủng loài</button><button data-scene="equipment05">05 · Cấp súng Zombie</button>
<button data-scene="performance">60 entity + 40 FX</button><button id="hold-pose" aria-pressed="false">Giữ khung f2 (chỉ QA)</button></div>
<p id="scene-ready" data-ready="false">Đang nạp asset…</p><div class="review-grid"><canvas id="art-canvas" aria-label="Bản xem cận cảnh asset đang dùng trong game"></canvas>
<aside class="review-aside"><div id="art-info"></div><div id="perf-data" aria-live="polite"></div><button id="perf-burst">Đo 120 khung render đồng bộ</button><pre id="burst-data"></pre></aside></div>
<canvas id="art-mini"></canvas><script type="module" src="art-review.js"></script></body></html>
